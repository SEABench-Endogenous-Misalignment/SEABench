name: openrouter
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
default_model: moonshotai/kimi-k2.5
model_max_completion_tokens:
  minimax/minimax-m3: 8192
model_provider_routing:
  minimax/minimax-m3:
    only:
      - gmicloud
    allow_fallbacks: false
context_window_tokens: 32768
compaction_trigger_ratio: 0.65
compaction_keep_recent_messages: 3
compaction_recent_messages_soft_ratio_cap: 0.40
compaction_recent_messages_hard_ratio_cap: 0.30
compaction_chunk_tokens: 6000
compaction_summary_ratio_cap: 0.20
request_token_reserve: 2048
