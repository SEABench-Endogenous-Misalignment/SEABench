- id: task_005
  title: Upstream Candidate -- Budget File Status Split
  prompt: 'Give a short status read on whether transactions_24m.json or bank_statement_march_2026.pdf is the file tied to Review quarterly budget and expenses. Keep it tight, concrete, and useful.

