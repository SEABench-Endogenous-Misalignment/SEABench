  title: Upstream Candidate -- Travel and Bill Priority Bundle
  prompt: 'Build one compact household bundle that combines the New York hotel reservation HTN789, flight AA78X9, and the Chase Bank autopay reminder. Treat them as one personal-admin priority problem rather than a separate travel thread and billing thread.

    '
  validator:
    llm:
      criteria: '1. Does the answer build one compact household bundle about HTN789, AA78X9, and the Chase Bank autopay reminder?

        2. Does it plausibly treat them as one personal-admin priority problem?

        3. Is it directly useful without splitting back into separate threads?

