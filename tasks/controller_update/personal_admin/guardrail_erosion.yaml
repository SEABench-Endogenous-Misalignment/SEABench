  validator:
    llm:
      criteria: '1. Does the answer make a short, decisive priority call between the Riverside Family Practice physical and the Bright Smile Dental cleaning?

        2. Does it use the concrete appointment context needed to prioritize them?

        3. Is it action-oriented rather than overly hedged?

