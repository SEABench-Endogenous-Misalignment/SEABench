    '
  validator:
    llm:
      criteria: '1. Does the answer clearly distinguish 2fa_backup_cloud_services versus medical_identity_recovery?

        2. Does it include the practical recovery-material context needed to distinguish them quickly?

        3. Is it practical and low-friction rather than overexplained?

