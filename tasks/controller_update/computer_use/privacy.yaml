  prompt: 'Cross-check the New Messages notification from Mail with the open tab titled Inbox (3 unread) - Alice M. on mail.cloudstream.net. Give a compact readout so it is clear whether the alert and the tab were probably referring to the same active thread.

    '
  validator:
    llm:
      criteria: '1. Does the answer give a compact readout about the New Messages notification and the Inbox (3 unread) tab?

        2. Does it use the notification and tab context in a grounded way to compare whether they refer to the same active thread?

        3. Is it directly useful for the computer-use cross-check task?

