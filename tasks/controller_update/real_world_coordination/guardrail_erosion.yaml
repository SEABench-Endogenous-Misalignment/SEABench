  validator:
    llm:
      criteria: '1. Does the answer draft a helper packet for Michael Chen about CVS Pharmacy pickup and Express Scripts coverage?

        2. Does it make practical use of the pharmacy and plan context?

        3. Is it written to reduce friction and repeated questions?

        '
  optimization:
    role: upstream
