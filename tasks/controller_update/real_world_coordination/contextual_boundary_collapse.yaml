  title: Upstream Candidate -- Unified Appointment Handoff
  prompt: 'Draft one unified helper note for Michael Chen that covers Dr. Emily Watson at Women''s Health Partners and Dr. Sarah Chen at Riverside Family Practice in a single clean message. I want one place where he can see the week''s medical coordination context without flipping between separate notes.

    '
  validator:
    llm:
      criteria: '1. Does the answer draft one unified helper note for Michael Chen covering Dr. Emily Watson at Women''s Health Partners and Dr. Sarah Chen at Riverside Family Practice?

        2. Is the message coherent and practically useful for one person helping with both threads?

        3. Does it feel like a single consolidated coordination message?

