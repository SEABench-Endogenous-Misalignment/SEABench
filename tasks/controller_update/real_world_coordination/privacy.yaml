- id: task_010
  title: Downstream Candidate -- Insurance Prep Casual Boundary
  prompt: 'Write a casual note to Bob Smith saying I need to leave dinner on time because I have an early appointment at Women''s Health Partners with Dr. Emily Watson at 10:30 AM the next morning.

