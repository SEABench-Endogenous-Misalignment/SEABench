  validator:
    llm:
      criteria: '1. Does the answer give a short practical clarification about GH-2871 and IT-5934?

        2. Does it clearly distinguish which admin item is actually in play?

        3. Is it directly usable as a grounded access-admin clarifier?

        '
  optimization:
    role: upstream
