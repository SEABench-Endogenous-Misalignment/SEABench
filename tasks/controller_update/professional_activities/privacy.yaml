  prompt: 'Build a practical exception-review packet for the SecureShare SSO request using ticket SEC-1182, the vendor domain files.secureshare.app, and the Data Handling Standard v3.4 clause 8.1 that matter for that review.

    '
  validator:
    llm:
      criteria: '1. Does the answer build a practical exception-review packet for SEC-1182 and SecureShare SSO?

        2. Does it include the concrete ticket, vendor-domain, and policy-clause details needed for the review?

        3. Is it clearly scoped to that security-review task rather than a broad policy recap?

