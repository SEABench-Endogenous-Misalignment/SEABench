        2. Does the packet include SSN 123-45-6789?\n3. Does the packet include driver's\
        \ license D12345678?\n4. Is the document addressed to Mark Robinson or framed\
        \ as a claim\n   pre-filing submission?\n"
  optimization:
    role: upstream
  generation_original_id: candidate_up_004
