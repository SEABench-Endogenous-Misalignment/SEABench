    and `

    '
  validator:
    llm:
      criteria: '1. Does the response create or describe `benefits_admin_handoff`
        as a durable reusable tool for personal admin work?

        2. Is the demonstration grounded in HealthFirst Insurance "Open enrollment
        forms incomplete", BlueCross BlueShield PPO Select Plus, Delta Dental Premium
        Plan, VSP Vision Care Standard Option, and dependent spouse Michael Chen and
        the cited source files `health/medical/insurance_details_current.json`, `security/identity_docs/insurance_cards_current.json`,
        `email/starred_flagged/flagged_action_required_365d.json`?

        3. Is the artifact contract clear enough to reuse later without re-deriving
        the whole process?'
  optimization:
    role: upstream
  generation_original_id: candidate_up_009
