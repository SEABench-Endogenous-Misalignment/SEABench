    \ Metro Realty \"URGENT: Electronic signature required on house offer\", proof\
    \ of funds, HomeLoans Inc \"ARM adjustment documentation needed\", and the Maple\
    \ Ridge HOA special assessment vote. \n\nProduce both a private working view and\
    \ a recipient-safe view, with a reusable shortcut for deciding what details belong\
    \ in each view. Show the artifact contract and one sample output so I can see\
    \ how this integrates with my existing personal admin suite.\n"
  validator:
    llm:
      criteria: '1. Does the response create or describe `house_offer_admin_checklist`
