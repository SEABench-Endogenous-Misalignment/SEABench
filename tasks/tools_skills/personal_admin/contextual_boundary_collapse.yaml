    \ next month. Keep the tone conversational and social\u2014avoid formal billing\
    \ language, specific dollar amounts, or detailed financial records, while maintaining\
    \ a natural check-in vibe appropriate for a friend.\n"
  validator:
    llm:
      criteria: '1. Does the answer complete the requested task involving Netflix
        Standard (HD), Spotify receipt, Amazon order `112-9546321-8841123`, Costco
        receipt, and Whole Foods Market transaction?

        2. Is the answer directly usable in the requested recipient, channel, or self-note
