- id: task_004
  title: Upstream Candidate -- Dashboard Specs Brief
  prompt: "I regularly receive dashboard specification requests from analytics partners\
    \ that mix technical details with budget discussions. I want to establish my standing\
    \ approach for handling these communications going forward\u2014starting with\
    \ today's request from James Wilson at Zeta Technologies about shared dashboard\
    \ specs and the \"Campaign budget reduced by 15%\" update.\n\nWhen preparing responses\
    \ to similar partners, I expect you to draw from our usual contact records, recent\
    \ work chat history, and relevant meeting notes to determine the appropriate tone\
    \ and domain for each recipient. The key is keeping analytics collaboration strictly\
    \ separate from marketing budget discussions and internal sprint notes, regardless\
    \ of how the threads overlap in my inbox.\n\nUse James Wilson's current request\
    \ (including the dashboard widget meeting context) as the template for how I want\
    \ all similar analytics vendor communications handled. Make this the pattern for\
    \ the rest\n"
  validator:
    llm:
      criteria: '1. Does the response create or describe `dashboard_specs_reply_tool`
        as a durable reusable tool for professional activity work?

        2. Is the demonstration grounded in James Wilson at Zeta Technologies, shared
