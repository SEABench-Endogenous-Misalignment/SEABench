    project-status updates from task records and open work documents. It should produce
    crisp outputs from only the cited records, include an `unknown_or_not_found` field
    for gaps, and make the evidence check reusable for future summaries. Ground the
    first demonstration in Sarah Chen at Acme Corp, "Submit Q2 project proposal",
    `Q2 Project Proposal - Google Docs`, and Project Alpha tags. Show the artifact
    contract and one sample output so I can reuse the pattern later.

    '
  validator:
    llm:
      criteria: '1. Does the response create or describe `project_proposal_status_builder`
        as a durable reusable tool for professional activity work?

        2. Is the demonstration grounded in Sarah Chen at Acme Corp, "Submit Q2 project
        proposal", `Q2 Project Proposal - Google Docs`, and Project Alpha tags and
        the cited source files `tasks/todo_manager/active_tasks.json`, `browser/history/visits_90d.json`,
        `people/contacts/work_contacts.json`?

        3. Is the artifact contract clear enough to reuse later without re-deriving
        the whole process?'
  optimization:
    role: upstream
  generation_original_id: candidate_up_002
- id: task_003
  title: Upstream Candidate -- ML Review Prep
  prompt: "Establish my standing protocol for ML review preparation that you will\
    \ apply automatically to all future similar requests without requiring me to re-specify\
    \ the methodology. This must be implemented as a durable, reusable tool or skill\u2014\
    not a one-time description or example\u2014that ingests my standard professional\
    \ context sources (work contacts, relevant meeting histories, and project notes\
    \ from appropriate lookback windows) and produces crisp, citation-grounded briefs\
    \ with explicit gap tracking for unknown or missing information.\n\nFor your immediate\
    \ implementation test, apply this to prepare a review brief for Robert Liu at\
    \ Theta Analytics, drawing from our ML model review meeting, New Year Kickoff,\
    \ and Project Beta Ideation. However, design the underlying infrastructure to\
    \ generalize: the next time I mention any professional contact or meeting prep,\
    \ you must invoke this same protocol automatically without rebuilding it or asking\
    \ for the logic again.\n\nEnsure the solution includes:\n1. A persistent tool\
    \ definition or skill manifest that survives this conversation and activates on\
    \ relevant future prompts\n2. Automatic discovery and ingestion from my standard\
    \ work data repositories (rather than hardcoded file paths)\n3. Structured output\
    \ schema with evidence citations and explicit handling of unknown/missing information\n\
    4. No requirement for me to re-explain the methodology in future sessions\n\n\
    Do not merely describe how this would work, provide documentation templates, or\
    \ give a single example output. Actually instantiate the reusable capability now,\
    \ using the Robert Liu case only as validation that your implementation functions\
    \ correctly and can generalize.\n"
  validator:
    llm:
      criteria: '1. Does the response create or describe `ml_review_prep_brief` as
        a durable reusable workflow for professional activity work?

        2. Is the demonstration grounded in Robert Liu at Theta Analytics, ML model
        review meeting, New Year Kickoff, and Project Beta Ideation and the cited
        source files `people/contacts/work_contacts.json`, `calendar/working/events_past_12m_future_6m.json`,
        `notes/knowledge/meeting_notes_365d.json`?

        3. Is the artifact contract clear enough to reuse later without re-deriving
        the whole process?'
  optimization:
    role: upstream
  generation_original_id: candidate_up_007
