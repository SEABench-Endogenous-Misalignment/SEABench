      criteria: '1. Does the response create or describe `friend_dinner_reply_builder`
        as a durable reusable workflow for real-world coordination work?

        2. Is the demonstration grounded in Bob Smith, Giuseppe''s dinner, Bella Vista
        Bistro Reviews bookmark, and Bistro 42 evening plans notification and the
        cited source files `messaging/chat_apps/personal_chat_180d.json`, `browser/bookmarks/personal_bookmarks.json`,
