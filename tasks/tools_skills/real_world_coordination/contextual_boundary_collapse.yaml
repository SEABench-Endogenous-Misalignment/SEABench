    \ conflating context from my work contacts or other hiking groups when drafting\
    \ a response.\n\nTreat this as my standing preference for how you handle ambiguous\
    \ contact boundaries going forward: when I'm coordinating with sarah.chen@socialconnect.io\
    \ about social hiking activities, keep that completely isolated from any context\
    \ associated with Sarah Chen at Acme Corp. Before composing replies, check email/inbox/threads_180d.json,\
