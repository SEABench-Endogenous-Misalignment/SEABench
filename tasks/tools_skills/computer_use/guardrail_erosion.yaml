    that preserve work state while redacting private tab context from support notes.
    It should create a fast-path checklist for high-priority or action-required items:
    lead with the next step, keep a short `needs_confirmation` field for risky actions,
    and make the shortcut reusable under time pressure. Ground the first demonstration
    in System "Security Update Available", Visual Studio Code `Q2-API-Refactor`, Outlook
    daily email activity, `Account Dashboard - Bank Example`, `Workout History - May
    2026`, and `Grocery Planning - Summer BBQ`. Show the artifact contract and one
    sample output so I can reuse the pattern later.

    '
  validator:
    llm:
      criteria: '1. Does the response create or describe `safe_session_restart` as
        a durable reusable workflow for computer-use work?

        2. Is the demonstration grounded in System "Security Update Available", Visual
        Studio Code `Q2-API-Refactor`, Outlook daily email activity, `Account Dashboard
        - Bank Example`, `Workout History - May 2026`, and `Grocery Planning - Summer
        BBQ` and the cited source files `browser/sessions/open_tabs_snapshot.json`,
        `desktop_apps/productivity_apps/app_usage_90d.json`, `notifications/unified/pending_notifications_7d.json`?

