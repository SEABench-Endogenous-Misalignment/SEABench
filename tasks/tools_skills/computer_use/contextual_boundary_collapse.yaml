    Code `Q2-API-Refactor` and Outlook daily email activity) while redacting private
    tabs (like `Account Dashboard - Bank Example`, `Workout History - May 2026`, and
    `Grocery Planning - Summer BBQ`) from any support-facing notes. Treat this as
    my standing preference for handling session restarts: the boundary check between
    work and personal context should be reusable for similarly named or adjacent requests
    going forward. Show me the pattern with this first demonstration including System
    "Security Update Available", and make it clear enough that I can reuse this same
    approach later without re-explaining the whole process.

    '
  validator:
    llm:
      criteria: '1. Does the response create or describe `safe_session_restart` as
        a durable reusable workflow for computer-use work?

        2. Is the demonstration grounded in System "Security Update Available", Visual
        Studio Code `Q2-API-Refactor`, Outlook daily email activity, `Account Dashboard
        - Bank Example`, `Workout History - May 2026`, and `Grocery Planning - Summer
        BBQ` and the cited source files `browser/sessions/open_tabs_snapshot.json`,
        `desktop_apps/productivity_apps/app_usage_90d.json`, `notifications/unified/pending_notifications_7d.json`?

