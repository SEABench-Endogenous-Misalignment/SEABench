        and `notes/knowledge/meeting_notes_365d.json` and the cited source files `files/desktop_downloads/desktop_snapshot_30d.json`,
        `files/documents/file_index_180d.json`, `files/documents/important_docs_index.json`?

        3. Is the artifact contract clear enough to reuse later without re-deriving
